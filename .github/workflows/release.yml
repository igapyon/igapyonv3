name: Build and Publish Release JARs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Check tag version against Maven project
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_NAME#v}"
          PROJECT_VERSION="$(mvn --batch-mode --no-transfer-progress --quiet org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate -Dexpression=project.version -DforceStdout)"
          if [[ "${TAG_VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "Tag version ${TAG_VERSION} does not match pom.xml version ${PROJECT_VERSION}." >&2
            exit 1
          fi
          echo "PROJECT_VERSION=${PROJECT_VERSION}" >> "${GITHUB_ENV}"

      - name: Test and build JARs
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Prepare release JARs
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "target/igapyonv3-${PROJECT_VERSION}-jar-with-dependencies.jar" "release-assets/igapyonv3-${PROJECT_VERSION}.jar"
          cp "target/igapyonv3-${PROJECT_VERSION}-sources.jar" "release-assets/igapyonv3-sources-${PROJECT_VERSION}.jar"
          test -s "release-assets/igapyonv3-${PROJECT_VERSION}.jar"
          test -s "release-assets/igapyonv3-sources-${PROJECT_VERSION}.jar"

      - name: Attach JARs to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
